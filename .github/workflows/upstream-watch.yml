name: upstream-watch

# Weekly digest of upstream OpenROAD changes since the commit upstream.yaml pins: commits per
# module and the functions they touch, commits that update regression goldens, OpenSTA submodule
# movement, and the week's pull requests and issues. Committed to reports/upstream-watch/, which
# also keeps the schedule alive (GitHub disables schedules in repos with 60 days of no commits).
on:
  schedule:
    - cron: '0 15 * * 6'   # Saturday 15:00 UTC = 07:00 PST / 08:00 PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/upstream-watch.py --out reports/upstream-watch

      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/upstream-watch
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "upstream-watch: digest $(date -u +%Y-%m-%d)"
          git push
