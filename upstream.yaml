# vyges-openroad build pin — the source of truth for what we build.
#
# Self-contained: this repo vendors nothing in-tree. CI clones OpenROAD at
# `commit` and BUILDS it. A sync workflow bumps `commit` when OpenROAD `master`
# advances (opening a PR); merging pins a release.
upstream:
  source: https://github.com/The-OpenROAD-Project/OpenROAD
  ref: master                                      # OpenROAD's default branch is `master`, not `main`
  commit: 27288f5c90265ae5296b2f5a9fa6e8714fa191ad # nightly-27288f5c9026, 2026-10-01 (upstream 26Q4 c4d317e + 6 neutral commits); version string set by the build
  # ⛔ REQUIRED BY BOTH build systems, measured 2026-09-19 — not a CMake-only step.
  # A Bazel build of a tree without them fails in ANALYSIS, before any compile:
  #   ERROR: no such package 'src/sta': BUILD file not found ...
  #   ERROR: /BUILD.bazel:212:10: no such package 'src/sta'
  # src/sta is the OpenSTA submodule and carries its own BUILD.bazel, so MODULE.bazel
  # does NOT stand in for it. (This line previously claimed the opposite; the trial
  # build falsified it.)
  recurse_submodules: true                         # sta, abc, slang-elab
  updated_at: "2026-10-11T23:28:14Z"

license:
  spdx: BSD-3-Clause                               # OpenROAD; shipped with the binary as LICENSE.OpenROAD

build:
  base_image: ubuntu:24.04                         # first-class in OpenROAD DependencyInstaller; glibc 2.39; LTS
  # ⛔ BAZEL is the build system for OpenROAD from 2026-09-19. Upstream defaulted
  # etc/Build.sh to it at d29f14a2 (2026-07-12) and is retiring CMake without a
  # date — leaving it to rot, which is how issue #11427 was found. This applies to
  # the OPENROAD build ONLY; our Rust/cargo infrastructure is not moving.
  build_system: cmake                              # scripts/build-bundle.sh: OR_BUILD_SYSTEM; bazel = the `bazel` branch
  # ⛔ main is CMake (2026-09-29); the Bazel default lives on the `bazel` branch.
  # Measured 2026-09-28 at this commit: the Bazel //:openroad is byte-identical to CMake
  # on the whole pdn suite (168/168 exit codes, 127/127 result files) and needs only
  # glibc >= 2.27 with libstdc++ static (CMake: glibc >= 2.39) — but it has NO PYTHON
  # (BUILD_PYTHON=false hardcoded; banner "-GPU -GUI -Python"), and LibreLane launches
  # `openroad -python`. build-bundle.sh refuses such a binary (OR_REQUIRE_PYTHON=0 overrides).
  deps: "resolved by MODULE.bazel (BCR-pinned, lockfile-enforced upstream)"
  compile: "bazelisk build --config=release --//:platform=cli //:openroad"
  # Retained fallback, selected with OR_BUILD_SYSTEM=cmake. Needed to build an
  # OLDER pinned commit, and it is the control if a Bazel binary ever differs.
  compile_cmake: "etc/Build.sh -no-gui -no-tests -cmake-build"
  deps_cmake: "etc/DependencyInstaller.sh -all"
